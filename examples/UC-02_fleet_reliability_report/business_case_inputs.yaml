use_case_id: UC-02
title: Monthly fleet reliability reports produced automatically, with anomaly flags
fictional: true
inputs:
  volume_per_month:
    label: Reports per month
    value: 30
    unit: customer fleet reports / month
    source: One report per customer fleet under a maintenance contract (fictional).
    confidence: high
  minutes_before:
    label: Preparation time per report today
    value: 180
    unit: minutes
    source: 'Reliability engineers'' estimate: extract, clean, calculate, chart, comment.'
    confidence: medium
  minutes_after:
    label: Preparation time per report with the solution
    value: 45
    unit: minutes
    source: Review of the generated report and of the anomaly flags; comment written by the engineer.
    confidence: low
  hourly_cost_eur:
    label: Fully loaded cost per hour
    value: 70
    unit: EUR / hour
    source: Controlling standard rate (fictional).
    confidence: high
  share_hours_redeployed:
    label: Share of saved hours redeployed or avoiding a cost
    value: 0.8
    unit: share (0-1)
    source: Freed time goes to the backlog of reliability investigations; the team lead has a named list of 12 open
      investigations.
    confidence: medium
  error_rate_before:
    label: Share of reports re-issued after a correction
    value: 0.1
    unit: share of reports
    source: Re-issue log, last 12 months (fictional).
    confidence: high
  error_rate_after:
    label: Share of reports re-issued with the solution
    value: 0.03
    unit: share of reports
    source: Remaining errors come from source data, not from manual copying; estimate.
    confidence: medium
  cost_per_error_eur:
    label: Cost per re-issued report
    value: 400
    unit: EUR / re-issue
    source: Engineer time to correct and re-issue plus account manager time with the customer.
    confidence: medium
  licence_cost_per_year_eur:
    label: Licence cost per year
    value: 0
    unit: EUR / year
    source: Built on the existing BI platform and an open-source anomaly-detection library.
    confidence: high
  build_days:
    label: Internal build effort
    value: 40
    unit: person-days
    source: Data model, calculations, anomaly model, report layout, tests.
    confidence: medium
  day_rate_eur:
    label: Internal day rate
    value: 600
    unit: EUR / day
    source: Controlling internal rate (fictional).
    confidence: high
  other_one_off_eur:
    label: Other one-off costs
    value: 5000
    unit: EUR
    source: Training and a customer-facing template review.
    confidence: medium
  run_cost_per_year_eur:
    label: Run cost per year
    value: 6000
    unit: EUR / year
    source: Platform capacity, monitoring and yearly review of the anomaly thresholds.
    confidence: medium
  adoption_initial:
    label: Adoption during the ramp-up
    value: 0.5
    unit: share of volume
    source: Half of the fleets in the first two months, starting with the largest customers.
    confidence: medium
  ramp_months:
