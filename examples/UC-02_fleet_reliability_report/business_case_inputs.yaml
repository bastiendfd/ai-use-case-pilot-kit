    value: 2
    unit: months
    source: Roll-out plan.
    confidence: medium
  adoption_steady:
    label: Adoption after the ramp-up
    value: 0.9
    unit: share of volume
    source: Two contracts with customer-specific report formats stay manual.
    confidence: medium
  discount_rate:
    label: Discount rate
    value: 0.08
    unit: per year
    source: Finance standard rate for internal projects (fictional).
    confidence: high
scenarios:
  minutes_after:
    pessimistic: 60
    optimistic: 30
    why: Review time depends on how many anomaly flags are false alarms.
  share_hours_redeployed:
    pessimistic: 0.5
    optimistic: 0.9
    why: Depends on whether investigations really absorb the freed time.
  adoption_steady:
    pessimistic: 0.75
    optimistic: 1.0
    why: Depends on how many customers accept the standard report format.
