# Business case inputs for UC-03.
#
# FICTIONAL EXAMPLE: "Northwind Aero Services", a fictional MRO and spare-parts
# company. All figures are invented, round and for illustration.
#
# Generated summary: business_case.md in this folder
# (python -m scoring.build_examples). Model and counting rules:
# templates/business_case.md.

use_case_id: UC-03
title: Failure codes suggested from maintenance work-order free text
fictional: true
inputs:
  volume_per_month:
    label: Work orders closed per month
    value: 5000
    unit: work orders / month
    source: Maintenance system, 12-month average (fictional).
    confidence: high
  minutes_before:
    label: Coding time per work order today
    value: 2
    unit: minutes
    source: Planner reads the technician's text and picks a code from about 400 failure codes.
    confidence: medium
  minutes_after:
    label: Coding time per work order with the solution
    value: 0.5
    unit: minutes
    source: Planner confirms or corrects the suggested code.
    confidence: low
  hourly_cost_eur:
    label: Fully loaded cost per hour
    value: 70
    unit: EUR / hour
    source: Controlling standard rate (fictional).
    confidence: high
  share_hours_redeployed:
    label: Share of saved hours redeployed or avoiding a cost
    value: 0.3
    unit: share (0-1)
    source: Saving is spread over 25 planners in slices of 90 seconds; only the share that reduces planned overtime
      is counted.
    confidence: medium
  error_rate_before:
    label: Share of work orders with a wrong failure code
    value: 0.2
    unit: share of work orders
    source: Audit of 300 closed work orders by the reliability team (fictional).
    confidence: medium
  error_rate_after:
    label: Share with a wrong failure code with the solution
    value: 0.08
    unit: share of work orders
    source: Target from a vendor-neutral benchmark on similar text; not yet tested on our data.
    confidence: low
  cost_per_error_eur:
    label: Cost per wrong failure code
    value: 15
    unit: EUR / work order
    source: Rework in reliability analysis and misdirected investigations, averaged.
    confidence: low
  licence_cost_per_year_eur:
    label: Licence cost per year
    value: 0
    unit: EUR / year
    source: Open-source model, trained and hosted in-house.
    confidence: high
  build_days:
    label: Internal build effort
    value: 80
    unit: person-days
    source: Labelling, model training, integration in the work-order screen, tests.
    confidence: medium
  day_rate_eur:
    label: Internal day rate
    value: 600
    unit: EUR / day
    source: Controlling internal rate (fictional).
    confidence: high
  other_one_off_eur:
    label: Other one-off costs
    value: 20000
    unit: EUR
    source: Clean-up of the failure-code list (duplicates, retired codes) and labelling support.
    confidence: medium
  run_cost_per_year_eur:
    label: Run cost per year
    value: 15000
    unit: EUR / year
    source: Hosting, monitoring, quarterly retraining and a monthly accuracy sample.
    confidence: medium
  adoption_initial:
    label: Adoption during the ramp-up
    value: 0.4
    unit: share of volume
    source: Two aircraft types first, during the pilot.
    confidence: medium
  ramp_months:
    label: Length of the ramp-up
    value: 6
    unit: months
    source: Pilot of 3 months plus roll-out.
    confidence: medium
  adoption_steady:
    label: Adoption after the ramp-up
    value: 0.8
    unit: share of volume
    source: Engine shop work orders use a separate coding scheme and stay manual.
    confidence: low
  discount_rate:
    label: Discount rate
    value: 0.08
    unit: per year
    source: Finance standard rate for internal projects (fictional).
    confidence: high
scenarios:
  error_rate_after:
    pessimistic: 0.14
    optimistic: 0.05
    why: Accuracy on our free text is unknown until the pilot measures it.
  minutes_after:
    pessimistic: 1.0
    optimistic: 0.3
    why: Planners may re-read the full text if they do not trust the suggestion.
  adoption_steady:
    pessimistic: 0.5
    optimistic: 0.9
    why: Depends on how many work-order types the model covers well.
review_gate_drivers:
- minutes_after
- adoption_steady
- error_rate_after
